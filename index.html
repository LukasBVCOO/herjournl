<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes the safe-area padding work on iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Also what Android tints the small notification icon with (see
         src/sw.ts) — needs to be dark to read against a pale badge. -->
    <meta name="theme-color" content="#3a3531" />
    <title>Becomely</title>
    <meta name="description" content="Turn your intentions into daily action." />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- iPhone ignores the app manifest, so it needs its own few lines -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Becomely" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body class="flex min-h-dvh flex-col">
    <div id="root" class="flex min-h-dvh flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
